<script>
window.__gsapReady = false;
window.__runGSAP = function() {
  if (window.__gsapReady) return;
  window.__gsapReady = true;

  const gsap = window.gsap;
  if (!gsap) return;

  // Register plugins
  gsap.registerPlugin(window.ScrollTrigger, window.TextPlugin);

  /* ─── 1. PAGE INTRO SEQUENCE ─── */
  const intro = gsap.timeline();

  intro
    // Hold splash
    .to({}, { duration: 0.5 })
    // Logo pulse
    .to('#pt-logo img', { scale: 1.1, duration: 0.35, ease: 'power2.out' })
    .to('#pt-logo img', { scale: 1.0, duration: 0.2, ease: 'power2.in' })
    // Logo fade out
    .to('#pt-logo', { opacity: 0, y: -20, duration: 0.35, ease: 'power2.in' }, '+=0.1')
    // Panels wipe up — middle first, then sides
    .to('.pt-panel:nth-child(2)', { yPercent: -100, duration: 0.65, ease: 'power4.inOut' }, '-=0.1')
    .to('.pt-panel:nth-child(1)', { yPercent: -100, duration: 0.65, ease: 'power4.inOut' }, '-=0.55')
    .to('.pt-panel:nth-child(3)', { yPercent: -100, duration: 0.65, ease: 'power4.inOut' }, '-=0.65')
    .set('#page-transition', { display: 'none' })
    .set('#pt-logo', { display: 'none' })

    /* ─── HERO ENTRANCE ─── */
    // Eyebrow slides in from left
    .fromTo('.hero-eyebrow',
      { opacity: 0, x: -30 },
      { opacity: 1, x: 0, duration: 0.55, ease: 'power3.out' }, '-=0.2')

    // Title chars rise up — fast stagger
    .to('.split-title .char', {
      y: 0, opacity: 1,
      duration: 0.55,
      stagger: { amount: 0.6, from: 'start' },
      ease: 'power3.out',
    }, '-=0.2')

    // Subtitle
    .fromTo('.hero-sub',
      { opacity: 0, y: 28 },
      { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, '-=0.2')

    // CTAs with slight scale pop
    .fromTo('.hero-ctas',
      { opacity: 0, y: 20, scale: 0.97 },
      { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: 'back.out(1.4)' }, '-=0.25')

    // Social proof
    .fromTo('.hero-proof',
      { opacity: 0, y: 16 },
      { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, '-=0.2')

    // Polaroids zoom in — from large to final size
    .fromTo('.hero-pol-main',
      { opacity: 0, scale: 1.9, rotation: 0 },
      { opacity: 1, scale: 1, rotation: -2, duration: 0.85, ease: 'back.out(1.2)' }, '-=0.5')
    .fromTo('.hero-pol-a',
      { opacity: 0, scale: 2.1, rotation: 0 },
      { opacity: 1, scale: 1, rotation: 3, duration: 0.75, ease: 'back.out(1.3)' }, '-=0.55')
    .fromTo('.hero-pol-b',
      { opacity: 0, scale: 2.1, rotation: 0 },
      { opacity: 1, scale: 1, rotation: -3, duration: 0.75, ease: 'back.out(1.3)' }, '-=0.6')

    // Wave
    .fromTo('.hero-wave',
      { opacity: 0, scaleX: 0.85 },
      { opacity: 1, scaleX: 1, duration: 0.6, ease: 'power2.out' }, '-=0.4');

  /* ─── 2. SCROLL-TRIGGERED SECTIONS ─── */
  // Wait a tick for React to render all sections
  setTimeout(() => {
    // Batch fade-in for all .fade-in elements
    gsap.utils.toArray('.fade-in').forEach((el, i) => {
      gsap.fromTo(el,
        { opacity: 0, y: 40 },
        {
          opacity: 1, y: 0,
          duration: 0.7,
          delay: (i % 4) * 0.1,
          ease: 'power3.out',
          scrollTrigger: {
            trigger: el,
            start: 'top 88%',
            toggleActions: 'play none none none',
          }
        }
      );
    });

    // Parallax on polaroid images while scrolling
    gsap.to('.hero-pol-main', {
      y: -40,
      ease: 'none',
      scrollTrigger: {
        trigger: '#hero',
        start: 'top top',
        end: 'bottom top',
        scrub: 1.2,
      }
    });
    gsap.to('.hero-pol-a, .hero-pol-b', {
      y: -20,
      ease: 'none',
      scrollTrigger: {
        trigger: '#hero',
        start: 'top top',
        end: 'bottom top',
        scrub: 0.8,
      }
    });

    // Cards in services — stagger on scroll
    gsap.fromTo('[data-gsap="service-card"]',
      { opacity: 0, y: 50, scale: 0.96 },
      {
        opacity: 1, y: 0, scale: 1,
        duration: 0.6,
        stagger: 0.12,
        ease: 'power3.out',
        scrollTrigger: {
          trigger: '#servicios',
          start: 'top 75%',
        }
      }
    );

    // Process steps — slide in from bottom staggered
    gsap.fromTo('[data-gsap="process-step"]',
      { opacity: 0, y: 60 },
      {
        opacity: 1, y: 0,
        duration: 0.65,
        stagger: 0.15,
        ease: 'power3.out',
        scrollTrigger: {
          trigger: '#proceso',
          start: 'top 75%',
        }
      }
    );

  }, 800);
};
</script>

const SplitTitle = ({ children, color }) => {
  const words = children.split(' ').filter(w => w.length > 0);
  return (
    <span style={{ color: color || 'inherit' }}>
      {words.map((word, wi) => (
        <React.Fragment key={wi}>
          <span className="word">
            {word.split('').map((ch, ci) => (
              <span key={ci} className="char">{ch}</span>
            ))}
          </span>
          {wi < words.length - 1 ? ' ' : ''}
        </React.Fragment>
      ))}
      {' '}
    </span>
  );
};

const Hero = () => {
  const heroRef = React.useRef(null);
  const orb1Ref = React.useRef(null);
  const orb2Ref = React.useRef(null);
  const orb3Ref = React.useRef(null);
  const [planes, setPlanes] = React.useState([]);

  // Trigger GSAP on mount — wait for DOM to be ready
  React.useEffect(() => {
    const run = () => {
      if (!window.gsap || !window.__runGSAP) return;
      // Wait until .char spans exist in the DOM
      const waitForChars = (attempts = 0) => {
        const chars = document.querySelectorAll('.split-title .char');
        if (chars.length > 0 || attempts > 20) {
          window.__runGSAP();
        } else {
          setTimeout(() => waitForChars(attempts + 1), 50);
        }
      };
      waitForChars();
    };
    // Use requestAnimationFrame to ensure React has painted
    requestAnimationFrame(() => requestAnimationFrame(run));
  }, []);

  // Mouse parallax
  React.useEffect(() => {
    const hero = heroRef.current;
    if (!hero) return;
    const onMove = (e) => {
      const rect = hero.getBoundingClientRect();
      const cx = (e.clientX - rect.left) / rect.width - 0.5;
      const cy = (e.clientY - rect.top) / rect.height - 0.5;
      if (orb1Ref.current) orb1Ref.current.style.transform = `translate(${cx * 40}px, ${cy * 30}px)`;
      if (orb2Ref.current) orb2Ref.current.style.transform = `translate(${cx * -30}px, ${cy * -25}px)`;
      if (orb3Ref.current) orb3Ref.current.style.transform = `translate(${cx * 20}px, ${cy * 40}px)`;
    };
    hero.addEventListener('mousemove', onMove);
    return () => hero.removeEventListener('mousemove', onMove);
  }, []);

/* Plane burst particle */
const PlaneBurst = ({ angle, x, y }) => {
  const rad = (angle * Math.PI) / 180;
  const dist = 80 + Math.random() * 60;
  const tx = Math.cos(rad) * dist;
  const ty = Math.sin(rad) * dist;
  const size = 12 + Math.random() * 8;
  return (
    <svg width={size} height={size} viewBox="0 0 24 24"
      style={{
        position:'fixed', left:x - size/2, top:y - size/2, zIndex:9999,
        fill:'#fff', pointerEvents:'none',
        animation:`planeBurst 0.8s cubic-bezier(0.4,0,0.2,1) forwards`,
        '--tx':`${tx}px`, '--ty':`${ty}px`, '--rot':`${angle + 45}deg`,
      }}>
      <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
    </svg>
  );
};

      entries.forEach((e) => {
        if (e.isIntersecting) {
          setTimeout(() => e.target.classList.add('visible'), Number(e.target.dataset.delay || 0));
        }
      });
    }, { threshold: 0.12 });
    document.querySelectorAll('.fade-in').forEach((el, i) => {
      el.dataset.delay = String(i % 4 * 100);
      observer.observe(el);
    });
    return () => observer.disconnect();
  }, []);

  return (
    <React.Fragment>
      <Nav />
      <Hero />
      <Problem />
      <Services />
      <Destinations />
      <Process />
      <Footer />
