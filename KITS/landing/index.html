<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Descúbrela Travel — Landing Page</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/TextPlugin.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Montserrat', sans-serif; color: #0D0D0D; background: #fff; -webkit-font-smoothing: antialiased; }

  /* Globals */
  .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #164DF2; margin-bottom: 12px; }
  .eyebrow-white { color: #F5A623; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 32px; border-radius: 9999px; font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; border: none; transition: all 0.25s cubic-bezier(0.4,0,0.2,1); text-decoration: none; }
  .btn-primary { background: #164DF2; color: #fff; }
  .btn-primary:hover { background: #165FF2; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(22,77,242,0.35); }
  .btn-wsp { background: #25D366; color: #fff; box-shadow: 0 4px 16px rgba(37,211,102,0.35); }
  .btn-wsp:hover { background: #1eb85a; transform: translateY(-2px); box-shadow: 0 8px 28px rgba(37,211,102,0.45); }
  .btn-outline { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,0.6); }
  .btn-outline:hover { background: rgba(255,255,255,0.1); border-color: #fff; }
  .section { padding: 96px 0; }
  .section-gray { background: #F5F6FA; }
  .section-navy { background: #0A2473; }
  .section-dark { background: #1A2D87; }
  /* GSAP page transition overlay */
  #page-transition {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column;
    pointer-events: none;
  }
  .pt-panel {
    flex: 1;
    background: #0A2473;
  }
  .pt-logo {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10000; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .pt-logo img { width: 450px; height: auto; border-radius: 14px; object-fit: contain; }
  .pt-logo-name { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 22px; color: #fff; letter-spacing: -0.01em; }
  .pt-logo-sub  { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 10px; color: #F5A623; letter-spacing: 0.2em; text-transform: uppercase; }

  /* Split title chars */
  .split-title .char {
    display: inline-block;
    transform: translateY(110%);
    opacity: 0;
    white-space: pre;
  }
  .split-title .word {
    display: inline-block;
    overflow: hidden;
    vertical-align: bottom;
    margin-right: 0.1em;
  }

  /* Override hero h1 animation — GSAP handles it */
  .hero-h1 { opacity: 1 !important; animation: none !important; }
  .hero-eyebrow { opacity: 1 !important; animation: none !important; }
  .hero-sub { opacity: 1 !important; animation: none !important; }
  .hero-ctas { opacity: 1 !important; animation: none !important; }
  .hero-proof { opacity: 1 !important; animation: none !important; }

  /* Scroll-triggered fade-in */
  .fade-in { opacity: 0; transform: translateY(32px); transition: opacity 0.7s cubic-bezier(0.4,0,0.2,1), transform 0.7s cubic-bezier(0.4,0,0.2,1); }
  .fade-in.visible { opacity: 1; transform: translateY(0); }

  /* Hero entrance animations */
  @keyframes heroFadeUp {
    from { opacity: 0; transform: translateY(36px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes heroFadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes polaroidFloat {
    from { opacity: 0; transform: rotate(-2deg) translateY(48px); }
    to   { opacity: 1; transform: rotate(-2deg) translateY(0); }
  }
  @keyframes polaroidFloatA {
    from { opacity: 0; transform: rotate(3deg) translateY(48px); }
    to   { opacity: 1; transform: rotate(3deg) translateY(0); }
  }
  @keyframes polaroidFloatB {
    from { opacity: 0; transform: rotate(-3deg) translateY(48px); }
    to   { opacity: 1; transform: rotate(-3deg) translateY(0); }
  }
  @keyframes waveReveal {
    from { opacity: 0; transform: scaleX(0.8); }
    to   { opacity: 1; transform: scaleX(1); }
  }

  .hero-eyebrow  { opacity: 0; animation: heroFadeUp 0.7s cubic-bezier(0.4,0,0.2,1) 0.2s forwards; }
  .hero-h1       { opacity: 0; animation: heroFadeUp 0.8s cubic-bezier(0.4,0,0.2,1) 0.45s forwards; }
  .hero-sub      { opacity: 0; animation: heroFadeUp 0.8s cubic-bezier(0.4,0,0.2,1) 0.65s forwards; }
  .hero-ctas     { opacity: 0; animation: heroFadeUp 0.7s cubic-bezier(0.4,0,0.2,1) 0.85s forwards; }
  .hero-proof    { opacity: 0; animation: heroFadeUp 0.7s cubic-bezier(0.4,0,0.2,1) 1.05s forwards; }
  @keyframes polaroidZoomMain {
    from { opacity: 0; transform: rotate(-2deg) scale(1.8) translateY(20px); }
    to   { opacity: 1; transform: rotate(-2deg) scale(1) translateY(0); }
  }
  @keyframes polaroidZoomA {
    from { opacity: 0; transform: rotate(3deg) scale(2) translateY(30px); }
    to   { opacity: 1; transform: rotate(3deg) scale(1) translateY(0); }
  }
  @keyframes polaroidZoomB {
    from { opacity: 0; transform: rotate(-3deg) scale(2) translateY(30px); }
    to   { opacity: 1; transform: rotate(-3deg) scale(1) translateY(0); }
  }
  @keyframes planeBurst {
    0%   { transform: translate(0,0) rotate(var(--rot)) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) rotate(calc(var(--rot) + 180deg)) scale(0.3); opacity: 0; }
  }

  .hero-pol-main { opacity: 0; animation: polaroidZoomMain 1s cubic-bezier(0.34,1.56,0.64,1) 0.6s forwards; }
  .hero-pol-a    { opacity: 0; animation: polaroidZoomA 1s cubic-bezier(0.34,1.56,0.64,1) 0.85s forwards; }
  .hero-pol-b    { opacity: 0; animation: polaroidZoomB 1s cubic-bezier(0.34,1.56,0.64,1) 1.05s forwards; }
  .hero-wave     { opacity: 0; animation: waveReveal 1s ease 1.1s forwards; }

  /* WhatsApp floating button */
  .wsp-float { position: fixed; bottom: 28px; right: 28px; z-index: 1000; width: 60px; height: 60px; background: #25D366; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 32px rgba(37,211,102,0.45); cursor: pointer; transition: transform 0.2s; text-decoration: none; }
  .wsp-float:hover { transform: scale(1.1); }
  .wsp-float svg { width: 30px; height: 30px; fill: #fff; }
  /* --- RESPONSIVE STYLES --- */
  /* Footer */
  .footer-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr 1fr;
    gap: 48px;
    margin-bottom: 56px;
  }

  /* Tablet & Mobile */
  @media (max-width: 768px) {
    .container { padding: 0 16px; }
    .section { padding: 64px 0; }

    .footer-grid {
      grid-template-columns: 1fr;
      gap: 32px;
      text-align: center;
    }

    .footer-brand-col {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .btn { padding: 12px 24px; font-size: 14px; }
    .eyebrow { font-size: 10px; }
  }

  /* Mobile */
  @media (max-width: 480px) {
    .container { padding: 0 12px; }
    .section { padding: 48px 0; }

    .btn { padding: 10px 20px; font-size: 13px; display: flex; justify-content: center; }
    .btn svg { width: 14px; height: 14px; }

    h1 { font-size: clamp(24px, 6vw, 36px) !important; }
    h2 { font-size: clamp(22px, 5vw, 32px) !important; }
    h3 { font-size: clamp(18px, 4vw, 24px) !important; }
    p { font-size: 14px !important; }

    .wsp-float { width: 56px; height: 56px; bottom: 20px; right: 20px; }
    .wsp-float svg { width: 28px; height: 28px; }
  }
</style>
</head>
<body>

<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Problem.jsx"></script>
<script type="text/babel" src="Services.jsx"></script>
<script type="text/babel" src="Destinations.jsx"></script>
<script type="text/babel" src="Process.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>

<script type="text/babel">
const WspFloat = () => (
  <a href="https://wa.me/51940071218?text=Hola%2C%20quiero%20informaci%C3%B3n%20para%20mi%20primer%20viaje" className="wsp-float" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
    <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347zM12 2C6.477 2 2 6.477 2 12c0 1.785.47 3.457 1.29 4.908L2 22l5.235-1.375A9.953 9.953 0 0012 22c5.516 0 10-4.477 10-10S17.516 2 12 2z"/></svg>
  </a>
);

const App = () => {
  React.useEffect(() => {
    const observer = new IntersectionObserver(entries => {
      entries.forEach((e, i) => {
        if (e.isIntersecting) {
          const delay = e.target.dataset.delay || 0;
          setTimeout(() => e.target.classList.add('visible'), delay);
        }
      });
    }, { threshold: 0.12 });
    document.querySelectorAll('.fade-in').forEach((el, i) => {
      el.dataset.delay = i % 4 * 100;
      observer.observe(el);
    });
    return () => observer.disconnect();
  }, []);

  return (
    <>
      <Nav />
      <Hero />
      <Problem />
      <Services />
      <Destinations />
      <Process />
      <Footer />
      <WspFloat />
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<div id="root"></div>

<!-- Page transition overlay: 3 panels -->
<div id="page-transition">
  <div class="pt-panel" style="background: linear-gradient(rgba(2, 45, 172, 0.377), rgba(2, 45, 172, 0.377)), url('./assets/FONDOINICIO.jpg') center/cover no-repeat fixed;"></div>
  <div class="pt-panel" style="background: linear-gradient(rgba(2, 45, 172, 0.377), rgba(2, 45, 172, 0.377)), url('./assets/FONDOINICIO.jpg') center/cover no-repeat fixed;"></div>
  <div class="pt-panel" style="background: linear-gradient(rgba(2, 45, 172, 0.377), rgba(2, 45, 172, 0.377)), url('./assets/FONDOINICIO.jpg') center/cover no-repeat fixed;"></div>
<div class="pt-logo" id="pt-logo">
  <img src=".\assets\LOGO DESCUBRELA PNG.png" alt="Descúbrela Travel">

</div>

<script>
window.__gsapReady = false;
window.__runGSAP = function() {
  if (window.__gsapReady) return;
  window.__gsapReady = true;

  const gsap = window.gsap;
  if (!gsap) return;

  // Register plugins
  gsap.registerPlugin(window.ScrollTrigger, window.TextPlugin);

  /* ─── 1. PAGE INTRO SEQUENCE ─── */
  const intro = gsap.timeline();

  intro
    // Hold splash
    .to({}, { duration: 0.5 })
    // Logo pulse
    .to('#pt-logo img', { scale: 1.1, duration: 0.35, ease: 'power2.out' })
    .to('#pt-logo img', { scale: 1.0, duration: 0.2, ease: 'power2.in' })
    // Logo fade out
    .to('#pt-logo', { opacity: 0, y: -20, duration: 0.35, ease: 'power2.in' }, '+=0.1')
    // Panels wipe up — middle first, then sides
    .to('.pt-panel:nth-child(2)', { yPercent: -100, duration: 0.65, ease: 'power4.inOut' }, '-=0.1')
    .to('.pt-panel:nth-child(1)', { yPercent: -100, duration: 0.65, ease: 'power4.inOut' }, '-=0.55')
    .to('.pt-panel:nth-child(3)', { yPercent: -100, duration: 0.65, ease: 'power4.inOut' }, '-=0.65')
    .set('#page-transition', { display: 'none' })
    .set('#pt-logo', { display: 'none' })

    /* ─── HERO ENTRANCE ─── */
    // Eyebrow slides in from left
    .fromTo('.hero-eyebrow',
      { opacity: 0, x: -30 },
      { opacity: 1, x: 0, duration: 0.55, ease: 'power3.out' }, '-=0.2')

    // Title chars rise up — fast stagger
    .to('.split-title .char', {
      y: 0, opacity: 1,
      duration: 0.55,
      stagger: { amount: 0.6, from: 'start' },
      ease: 'power3.out',
    }, '-=0.2')

    // Subtitle
    .fromTo('.hero-sub',
      { opacity: 0, y: 28 },
      { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, '-=0.2')

    // CTAs with slight scale pop
    .fromTo('.hero-ctas',
      { opacity: 0, y: 20, scale: 0.97 },
      { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: 'back.out(1.4)' }, '-=0.25')

    // Social proof
    .fromTo('.hero-proof',
      { opacity: 0, y: 16 },
      { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, '-=0.2')

    // Polaroids zoom in — from large to final size
    .fromTo('.hero-pol-main',
      { opacity: 0, scale: 1.9, rotation: 0 },
      { opacity: 1, scale: 1, rotation: -2, duration: 0.85, ease: 'back.out(1.2)' }, '-=0.5')
    .fromTo('.hero-pol-a',
      { opacity: 0, scale: 2.1, rotation: 0 },
      { opacity: 1, scale: 1, rotation: 3, duration: 0.75, ease: 'back.out(1.3)' }, '-=0.55')
    .fromTo('.hero-pol-b',
      { opacity: 0, scale: 2.1, rotation: 0 },
      { opacity: 1, scale: 1, rotation: -3, duration: 0.75, ease: 'back.out(1.3)' }, '-=0.6')

    // Wave
    .fromTo('.hero-wave',
      { opacity: 0, scaleX: 0.85 },
      { opacity: 1, scaleX: 1, duration: 0.6, ease: 'power2.out' }, '-=0.4');

  /* ─── 2. SCROLL-TRIGGERED SECTIONS ─── */
  // Wait a tick for React to render all sections
  setTimeout(() => {
    // Batch fade-in for all .fade-in elements
    gsap.utils.toArray('.fade-in').forEach((el, i) => {
      gsap.fromTo(el,
        { opacity: 0, y: 40 },
        {
          opacity: 1, y: 0,
          duration: 0.7,
          delay: (i % 4) * 0.1,
          ease: 'power3.out',
          scrollTrigger: {
            trigger: el,
            start: 'top 88%',
            toggleActions: 'play none none none',
          }
        }
      );
    });

    // Parallax on polaroid images while scrolling
    gsap.to('.hero-pol-main', {
      y: -40,
      ease: 'none',
      scrollTrigger: {
        trigger: '#hero',
        start: 'top top',
        end: 'bottom top',
        scrub: 1.2,
      }
    });
    gsap.to('.hero-pol-a, .hero-pol-b', {
      y: -20,
      ease: 'none',
      scrollTrigger: {
        trigger: '#hero',
        start: 'top top',
        end: 'bottom top',
        scrub: 0.8,
      }
    });

    // Cards in services — stagger on scroll
    gsap.fromTo('[data-gsap="service-card"]',
      { opacity: 0, y: 50, scale: 0.96 },
      {
        opacity: 1, y: 0, scale: 1,
        duration: 0.6,
        stagger: 0.12,
        ease: 'power3.out',
        scrollTrigger: {
          trigger: '#servicios',
          start: 'top 75%',
        }
      }
    );

    // Process steps — slide in from bottom staggered
    gsap.fromTo('[data-gsap="process-step"]',
      { opacity: 0, y: 60 },
      {
        opacity: 1, y: 0,
        duration: 0.65,
        stagger: 0.15,
        ease: 'power3.out',
        scrollTrigger: {
          trigger: '#proceso',
          start: 'top 75%',
        }
      }
    );

  }, 800);
};
</script>
</body>
</html>
